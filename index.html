<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Loyola College Negombo</title>
    <meta name="description" content="Official modern school website for Loyola College Negombo." />
    <style>
      :root {
        --boot-navy: #0a1628;
        --boot-gold: #d4a017;
      }

      body {
        margin: 0;
      }

      .boot-loader {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background:
          radial-gradient(circle at center, rgb(255 255 255 / 0.88), transparent 36%),
          linear-gradient(135deg, #eef3ff, #f8fafc);
      }

      .boot-loader-mark {
        position: relative;
        display: grid;
        width: 132px;
        height: 132px;
        place-items: center;
      }

      .boot-loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: conic-gradient(from 0deg, var(--boot-navy), var(--boot-gold), var(--boot-navy));
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 7px),
          #000 calc(100% - 6px)
        );
        mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
        animation: boot-loader-spin 1.7s linear infinite;
      }

      .boot-loader-ring + .boot-loader-ring {
        inset: 12px;
        opacity: 0.72;
        animation-direction: reverse;
        animation-duration: 2.4s;
      }

      .boot-loader img {
        position: relative;
        width: 86px;
        height: 86px;
        border: 4px solid var(--boot-gold);
        border-radius: 999px;
        background: white;
        object-fit: contain;
        padding: 8px;
        box-shadow: 0 18px 42px -24px rgb(10 22 40 / 0.55);
      }

      @keyframes boot-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" aria-label="Loading Loyola College">
        <div class="boot-loader-mark">
          <span class="boot-loader-ring"></span>
          <span class="boot-loader-ring"></span>
          <img src="/loyola-crest.jpg" alt="Loyola College" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
