<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users</title><link rel="stylesheet" href="/styles.css"></head>
<body><nav class="nav"><a class="logo" href="/"><span class="badge">LC</span><span>Users</span></a><div class="navlinks"><a href="/admin.html">Admin</a><a href="/staff.html">Staff</a></div></nav>
<section class="section"><h2>Users & Roles</h2><p class="section-intro">Create users after logging in with token.</p>
<div class="grid"><div class="card"><h3>Login</h3><input id="email" class="input" placeholder="Email"><br><br><input id="password" class="input" type="password" placeholder="Password"><br><br><button class="btn" onclick="login()">Login</button><pre id="out"></pre></div>
<div class="card"><h3>Create Masteradmin</h3><input id="mname" class="input" placeholder="Name"><br><br><input id="memail" class="input" placeholder="Email"><br><br><input id="mpass" class="input" type="password" placeholder="Password"><br><br><button class="btn" onclick="setup()">Create</button></div></div></section>
<script>
let token='';async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();token=j.token||'';out.textContent=JSON.stringify(j,null,2)}
async function setup(){const r=await fetch('/api/setup-masteradmin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:mname.value,email:memail.value,password:mpass.value})});out.textContent=JSON.stringify(await r.json(),null,2)}
</script></body></html>
