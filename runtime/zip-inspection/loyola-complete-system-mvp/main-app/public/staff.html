<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Management</title><link rel="stylesheet" href="/styles.css"></head>
<body><nav class="nav"><a class="logo" href="/"><span class="badge">LC</span><span>Staff Management</span></a><div class="navlinks"><a href="/admin.html">Admin</a><a href="/">Public</a></div></nav>
<section class="section"><h2>Staff Management</h2><p class="section-intro">One person = one profile. Many roles = staff positions.</p>
<div class="toolbar"><input id="search" class="input" placeholder="Search staff by name/id" oninput="render()"></div>
<div class="card"><h3>Add Staff</h3><div class="grid"><input id="staff_id" class="input" placeholder="Staff ID"><input id="full_name" class="input" placeholder="Full Name"><input id="staff_email" class="input" placeholder="Email"><input id="position" class="input" placeholder="Position"><input id="department" class="input" placeholder="Department"><input id="subject" class="input" placeholder="Subject"><input id="classes" class="input" placeholder="Classes"></div><br><button class="btn" onclick="addStaff()">Save Staff</button><p id="msg"></p></div>
<div class="grid" id="staffGrid"></div></section>
<script>
let staff=[];async function load(){staff=await(await fetch('/api/staff')).json();render()}
function render(){const q=search.value.toLowerCase();staffGrid.innerHTML=staff.filter(s=>(s.full_name+s.staff_id+(s.positions||'')).toLowerCase().includes(q)).map(s=>`<div class="card"><h3>${s.full_name}</h3><p><b>${s.staff_id}</b></p><p>${s.positions||'No position'}</p><p>${s.staff_type||''}</p></div>`).join('')||'<div class="card">No staff found.</div>'}
async function addStaff(){const payload={staff_id:staff_id.value,full_name:full_name.value,email:staff_email.value,position:position.value,department:department.value,subject:subject.value,classes:classes.value};const r=await fetch('/api/staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg.textContent=JSON.stringify(await r.json());load()}
load();
</script></body></html>
