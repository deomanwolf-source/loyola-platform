<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Loyola College Negombo</title>
    <meta name="description" content="Official modern school website for Loyola College Negombo." />
    <style>
      :root {
        --boot-navy: #0a1628;
        --boot-gold: #d4a017;
      }

      body {
        margin: 0;
      }

      .boot-loader {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background:
          radial-gradient(circle at center, rgb(255 255 255 / 0.88), transparent 36%),
          linear-gradient(135deg, #eef3ff, #f8fafc);
      }

      .boot-loader-mark {
        position: relative;
        display: grid;
        width: 132px;
        height: 132px;
        place-items: center;
      }

      .boot-loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: conic-gradient(from 0deg, var(--boot-navy), var(--boot-gold), var(--boot-navy));
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 7px),
          #000 calc(100% - 6px)
        );
        mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
        animation: boot-loader-spin 1.7s linear infinite;
      }

      .boot-loader-ring + .boot-loader-ring {
        inset: 12px;
        opacity: 0.72;
        animation-direction: reverse;
        animation-duration: 2.4s;
      }

      .boot-loader img {
        position: relative;
        width: 86px;
        height: 86px;
        border: 4px solid var(--boot-gold);
        border-radius: 999px;
        background: white;
        object-fit: contain;
        padding: 8px;
        box-shadow: 0 18px 42px -24px rgb(10 22 40 / 0.55);
      }

      .boot-error {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: linear-gradient(135deg, #eef3ff, #f8fafc);
        color: #172033;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }

      .boot-error-card {
        width: min(100%, 430px);
        border: 1px solid #d8e1f5;
        border-radius: 8px;
        background: white;
        box-shadow: 0 24px 70px -42px rgb(10 22 40 / 0.55);
        padding: 28px;
        text-align: center;
      }

      .boot-error-card img {
        width: 70px;
        height: 70px;
        border: 3px solid var(--boot-gold);
        border-radius: 999px;
        object-fit: contain;
        padding: 6px;
      }

      .boot-error-card h1 {
        color: var(--boot-navy);
        font-size: 24px;
        line-height: 1.2;
        margin: 18px 0 10px;
      }

      .boot-error-card p {
        color: #5d6a7e;
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
      }

      .boot-error-card button {
        border: 0;
        border-radius: 8px;
        background: var(--boot-navy);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        margin-top: 18px;
        padding: 11px 18px;
      }

      @keyframes boot-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CoQW07w0.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vendor-lucide-DbJ5Vk6p.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CTFcPf1Q.css">
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" aria-label="Loading Loyola College">
        <div class="boot-loader-mark">
          <span class="boot-loader-ring"></span>
          <span class="boot-loader-ring"></span>
          <img src="/loyola-crest.jpg" alt="Loyola College" />
        </div>
      </div>
    </div>
    <script>
      (function () {
        var rootId = "root";
        var settled = false;

        function showBootError() {
          if (settled) return;
          var root = document.getElementById(rootId);
          if (!root || !root.querySelector(".boot-loader")) return;
          settled = true;
          root.innerHTML =
            '<main class="boot-error" role="alert">' +
            '<section class="boot-error-card">' +
            '<img src="/loyola-crest.jpg" alt="Loyola College" />' +
            "<h1>Unable to load Loyola College</h1>" +
            "<p>The website files did not finish loading. Refresh the page, or try again shortly.</p>" +
            '<button type="button" onclick="window.location.reload()">Refresh</button>' +
            "</section>" +
            "</main>";
        }

        var timer = window.setTimeout(showBootError, 20000);

        window.__loyolaBootComplete = function () {
          settled = true;
          window.clearTimeout(timer);
        };

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
              showBootError();
            }
          },
          true,
        );
        window.addEventListener("unhandledrejection", showBootError);
      })();
    </script>
  </body>
